[project]
name = "github-anti-ai"
version = "0.1.0"
description = "Persönliche Explore-Seite für überwiegend von Menschen geschriebene GitHub-Repos"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.scripts]
github-anti-ai = "github_anti_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_anti_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
markers = ["live: greift live auf APIs zu und braucht einen Token"]
