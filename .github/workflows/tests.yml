# Prüft bei jeder Änderung, ob die Tests bestehen und der Code einheitlich aussieht.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Genaue Version, damit eine neue Ruff-Regel nicht unangekündigt den Lauf rot macht.
  # Von Hand anheben, dann einmal "uvx ruff@… format" und "check --fix" laufen lassen.
  RUFF: ruff@0.14.0

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      # Auch wenn Tests scheitern: Stilfehler sollen im selben Lauf auffallen.
      - name: Stil prüfen
        if: ${{ !cancelled() }}
        run: |
          uvx "$RUFF" check src tests checks
          uvx "$RUFF" format --check src tests checks
