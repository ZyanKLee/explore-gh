# Der tägliche Lauf: die Ausgaben (GitHub, HN, Foren) nacheinander erzeugen
# und gemeinsam ins Repo schreiben. Ist er fertig, startet der Workflow "Website" und
# veröffentlicht die Seite.
#
# Scheitert ein Teil, laufen die anderen trotzdem. Was fertig geworden ist, kommt ins
# Repo und auf die Seite. Der Lauf endet dann rot, damit der Fehler auffällt.
#
# Braucht im Repo:
#   - Secret COLLECT_TOKEN: klassischer Personal Access Token ohne Scopes.
#     Der eingebaute Token erlaubt nur 1000 Anfragen pro Stunde, ein erster Lauf
#     braucht rund 3000.
#   - Ein Copilot-Abo des Repo-Besitzers: Die Copilot-CLI liest die Repos der Ausgabe
#     gegen und rechnet über den eingebauten Token auf dieses Abo ab. Fällt sie aus,
#     erscheint die Ausgabe ohne Gegenlesen.
name: Tägliche Ausgaben

on:
  schedule:
    # 02:43 UTC (03:43 Uhr deutscher Winterzeit, 04:43 Uhr Sommerzeit). Krumme Minute,
    # weil zur vollen Stunde viele Läufe gleichzeitig starten. Früh am Morgen, weil
    # geplante Läufe um 05:17 UTC oft Stunden zu spät starteten.
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # die Ausgaben des Tages werden ins Repo geschrieben
  copilot-requests: write   # die Copilot-CLI liest die Repos der Ausgabe gegen

# Nie zwei Läufe gleichzeitig: Beide würden dieselben Ausgaben schreiben wollen.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  editions:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      # Der Tag steht fest, bevor gesammelt wird: Ein Lauf über Mitternacht (UTC)
      # gehört zu dem Tag, an dem er begonnen hat.
      - name: Tag festlegen
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Momentaufnahmen der letzten Tage. Sie liegen nicht im Repo, werden aber
      # gebraucht, damit der Lauf nur Neues holt (8 statt 40 Minuten). Fehlt der
      # Cache, holt der Lauf alles neu.
      - name: Momentaufnahmen der letzten Tage holen
        uses: actions/cache/restore@v6
        with:
          path: data/snapshots
          key: snapshots-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            snapshots-

      # --- GitHub ---

      - name: GitHub sammeln
        env:
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN }}
        run: |
          # Ein zweiter Versuch holt nach, was beim ersten gescheitert ist.
          uv run github-anti-ai collect || uv run github-anti-ai collect

      # Auch nach einem gescheiterten Lauf: Was gesammelt ist, muss nicht noch einmal
      # geholt werden.
      - name: Momentaufnahmen aufheben
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/snapshots
          key: snapshots-${{ steps.day.outputs.day }}-${{ github.run_id }}

      # "!cancelled()" heißt hier und weiter unten: auch dann laufen, wenn ein Schritt
      # davor gescheitert ist. Nur ein abgebrochener Lauf hört wirklich auf.

      # Scheitert die Installation, erscheint die Ausgabe ohne Gegenlesen.
      - name: Copilot-CLI installieren
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm install -g @github/copilot

      # --allow-incomplete: Die Ausgabe entsteht auch, wenn beim Sammeln Repos fehlen.
      # Eine Ausgabe mit Lücken ist besser als keine. Ganz ohne Momentaufnahmen des
      # Tages gibt es keine Ausgabe.
      - name: GitHub-Ausgabe erzeugen
        if: ${{ !cancelled() }}
        env:
          # der eingebaute Token, nicht COLLECT_TOKEN: Die Copilot-CLI nimmt keine
          # klassischen Personal Access Tokens an
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f "data/editions/${{ steps.day.outputs.day }}.json" ]; then
            echo "Die Ausgabe vom ${{ steps.day.outputs.day }} gibt es schon."
          else
            uv run github-anti-ai publish --day "${{ steps.day.outputs.day }}" --review --allow-incomplete
          fi

      # --- HN ---

      - name: HN-Projekte suchen, sammeln und filtern
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN }}
        run: uv run github-anti-ai collect-hn

      # --- Foren (Lobsters, Lemmy, Mastodon) ---
      # Eine Ausgabe je Woche, sie gehört zum Montag. An den übrigen Tagen gibt es sie
      # schon, der Schritt tut dann nichts. Scheitert er am Montag, holt der Dienstag ihn nach.

      - name: Foren-Projekte der Woche suchen, sammeln und filtern
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.COLLECT_TOKEN }}
        run: uv run github-anti-ai collect-forums

      # --- Gemeinsam ins Repo ---

      - name: Ausgaben und Langzeitdaten ins Repo schreiben
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/history data/forums-editions
          git add data/editions data/history data/hn-editions data/lobsters-editions data/forums-editions
          if git diff --cached --quiet; then
            echo "Nichts Neues."
          else
            git commit -m "Ausgaben vom ${{ steps.day.outputs.day }}"
            # falls während des Laufs jemand etwas ins Repo geschrieben hat
            git pull --rebase
            git push
          fi
