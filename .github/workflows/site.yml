# Baut die Seite und veröffentlicht sie auf GitHub Pages. Läuft
#   - nach jedem erfolgreichen täglichen Lauf,
#   - nach jeder erfolgreichen HN-Ausgabe,
#   - nach jeder erfolgreichen Lobsters-Ausgabe,
#   - wenn sich das Aussehen oder eine Ausgabe ändert,
#   - von Hand.
#
# Braucht im Repo: Settings → Pages → Source: "GitHub Actions"
name: Website

on:
  # Was der tägliche Lauf ins Repo schreibt, löst keinen "push" aus. Deshalb hängt
  # dieser Workflow ausdrücklich an seinem Ende.
  workflow_run:
    workflows: ["Tägliche Ausgabe", "HN-Ausgabe"]
    workflows: ["Tägliche Ausgabe", "HN-Ausgabe", "Lobsters-Ausgabe"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "src/github_anti_ai/publication/**"
      - "data/editions/**"
      - "data/hn-editions/**"
      - "data/lobsters-editions/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  # Zählt die Besuche der veröffentlichten Seite. Lokale Vorschauen zählen nicht.
  PLAUSIBLE_SCRIPT: https://c.wcsstuttgart.dance/js/pa-10vu7R4kgjO_NSLSnZ7N8.js

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nach einem gescheiterten täglichen Lauf gibt es nichts Neues zu zeigen.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/configure-pages@v6
        id: pages
      - name: Website bauen
        run: >
          uv run github-anti-ai site --output _site
          --site-url "${{ steps.pages.outputs.base_url }}/"
          --plausible "$PLAUSIBLE_SCRIPT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
