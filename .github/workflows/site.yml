# Baut die Seite und veröffentlicht sie auf GitHub Pages. Läuft
#   - nach jedem täglichen Lauf, auch einem teilweise gescheiterten: Was er an
#     Ausgaben geschafft hat, soll auf die Seite,
#   - wenn sich das Aussehen, eine Ausgabe oder die Liste zurückgezogener Repos ändert,
#   - von Hand.
#
# Braucht im Repo: Settings → Pages → Source: "GitHub Actions"
name: Website

on:
  # Was der tägliche Lauf ins Repo schreibt, löst keinen "push" aus. Deshalb hängt
  # dieser Workflow ausdrücklich an seinem Ende.
  workflow_run:
    workflows: ["Tägliche Ausgaben"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "src/explore_gh/publication/**"
      - "data/editions/**"
      - "data/hn-editions/**"
      - "data/lobsters-editions/**"
      - "data/forums-editions/**"
      - "data/withdrawn.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

env:
  # Zählt die Besuche der veröffentlichten Seite. Lokale Vorschauen zählen nicht.
  PLAUSIBLE_SCRIPT: https://c.wcsstuttgart.dance/js/pa-10vu7R4kgjO_NSLSnZ7N8.js

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nach einem abgebrochenen Lauf nicht. Nach einem gescheiterten schon: Er kann
    # einen Teil der Ausgaben geschrieben haben.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/configure-pages@v6
        id: pages
      - name: Website bauen
        run: >
          uv run explore-gh site --output _site
          --site-url "${{ steps.pages.outputs.base_url }}/"
          --plausible "$PLAUSIBLE_SCRIPT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
